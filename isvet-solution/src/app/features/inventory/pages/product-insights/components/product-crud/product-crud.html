<p-drawer
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [position]="position()"
  [styleClass]="styleClass()"
  [closable]="closable()"
>
  <!-- HEADER -->
  <ng-template #header>
    <div class="flex items-center justify-between w-full">
      <h2 class="m-0 font-semibold text-lg md:text-xl">
        {{ isEditing() ? "Editar produto" : "Novo produto" }}
      </h2>
      <div class="flex gap-2">
        <button
          pButton
          type="button"
          label="Cancelar"
          class="p-button-secondary p-button-sm"
          icon="pi pi-times"
          (click)="onCancel()"
        ></button>
        <button
          pButton
          type="submit"
          label="Salvar"
          icon="pi pi-check"
          class="p-button-sm"
          [disabled]="!formValid()"
          (click)="onSave()"
        ></button>
      </div>
    </div>
  </ng-template>

  <!-- FORM em card único -->
  <form #prodForm="ngForm" (ngSubmit)="onSave()" class="p-4">
    <!-- 1) Informações gerais -->
    <div class="flex justify-between">
      <h3 class="text-lg font-semibold">Informações gerais</h3>
      <div class="flex items-center gap-2">
        <p-toggleswitch
          name="active"
          [ngModel]="form().active"
          (ngModelChange)="patch({ active: $event })"
        ></p-toggleswitch>
        <span>Ativo</span>
      </div>
    </div>

    <div class="grid gap-6 mt-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="pf_name"
            name="name"
            class="w-full"
            [ngModel]="form().name"
            (ngModelChange)="patch({ name: $event })"
            required
            minlength="3"
          />
          <label for="pf_name">Nome*</label>
        </p-floatlabel>

        <p-floatlabel variant="on">
          <input
            pInputText
            id="pf_barcode"
            name="barcode"
            class="w-full"
            [ngModel]="form().barcode ?? ''"
            (ngModelChange)="patch({ barcode: $event })"
          />
          <label for="pf_barcode">Código de barras</label>
        </p-floatlabel>
      </div>

      <p-floatlabel variant="on">
        <textarea
          pTextarea
          id="pf_description"
          name="description"
          class="w-full"
          rows="3"
          [ngModel]="form().description ?? ''"
          (ngModelChange)="patch({ description: $event })"
        ></textarea>
        <label for="pf_description">Descrição</label>
      </p-floatlabel>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <p-floatlabel variant="on">
          <p-select
            id="pf_unit"
            name="unit"
            class="w-full"
            [options]="unitOptions()"
            optionLabel="label"
            optionValue="value"
            [ngModel]="form().unit"
            (ngModelChange)="patch({ unit: $event })"
          />
          <label for="pf_unit">Unidade</label>
        </p-floatlabel>

        <p-floatlabel variant="on">
          <p-select
            id="pf_category"
            name="category"
            class="w-full"
            [options]="categoryOptions()"
            optionLabel="label"
            optionValue="value"
            [ngModel]="form().category"
            (ngModelChange)="patch({ category: $event })"
          />
          <label for="pf_category">Categoria</label>
        </p-floatlabel>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="pf_brand"
            name="manufacturer"
            class="w-full"
            [ngModel]="form().manufacturer ?? ''"
            (ngModelChange)="patch({ manufacturer: $event })"
          />
          <label for="pf_brand">Marca/Fabricante</label>
        </p-floatlabel>
      </div>
    </div>

    <p-divider />

    <!-- 2) Estoque -->
    <h3 class="text-lg font-semibold">Estoque</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-8">
      <p-floatlabel variant="on">
        <p-inputnumber
          inputId="pf_qty"
          name="currentQty"
          class="w-full"
          [min]="0"
          [showButtons]="true"
          [ngModel]="form().currentQty"
          (ngModelChange)="patch({ currentQty: $event ?? 0 })"
        />
        <label for="pf_qty">Estoque atual</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-inputnumber
          inputId="pf_min"
          name="minStock"
          class="w-full"
          [min]="0"
          [showButtons]="true"
          [ngModel]="form().minStock"
          (ngModelChange)="patch({ minStock: $event ?? 0 })"
          required
        />
        <label for="pf_min">Estoque mínimo*</label>
      </p-floatlabel>
    </div>

    <p-divider />

    <!-- 3) Validade / Lotes -->
    <h3 class="text-lg font-semibold mb-2">Validade / Lotes</h3>
    <div class="flex justify-end mb-2">
      <button
        pButton
        type="button"
        icon="pi pi-plus"
        label="Adicionar lote"
        (click)="addLotRow()"
      ></button>
    </div>

    <p-table [value]="lotRows()" [tableStyle]="{ 'min-width': '30rem' }">
      <ng-template #header>
        <tr>
          <th style="width: 25%">Lote</th>
          <th style="width: 25%">Validade</th>
          <th style="width: 15%">Quantidade</th>
          <th style="width: 20%"></th>
        </tr>
      </ng-template>

      <ng-template #body let-r let-i="rowIndex">
        <tr>
          <td>
            <input
              pInputText
              class="w-full"
              [ngModel]="r.lot"
              name="lot_{{ i }}"
              placeholder="Ex.: L-123"
            />
          </td>
          <td>
            <p-datepicker
              name="expiresAt_{{ i }}"
              [ngModel]="r.expiresAt"
              dateFormat="dd/mm/yy"
              iconDisplay="input"
              [appendTo]="'body'"
              panelStyleClass="dp-on-drawer"
              [showIcon]="true"
              class="w-full"
            />
          </td>
          <td>
            <p-inputnumber
              [ngModel]="r.quantity"
              name="qty_{{ i }}"
              [min]="0"
              [showButtons]="true"
              [inputStyle]="{ width: '5rem' }"
            ></p-inputnumber>
          </td>
          <td class="text-right">
            <button
              pButton
              type="button"
              icon="pi pi-trash"
              class="p-button-danger p-button-outlined"
              (click)="removeLotRow(i)"
            ></button>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="text-center py-4">Nenhum lote adicionado.</td>
        </tr>
      </ng-template>
    </p-table>
  </form>
</p-drawer>
