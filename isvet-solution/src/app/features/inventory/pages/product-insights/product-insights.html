<app-product-kpi
  [expiringWithinDays]="expiringWithinDays"
  [kpi]="kpi()"
  [active]="activeKpiFilter"
  (select)="activeKpiFilter = $event"
></app-product-kpi>

<app-product-filters
  [(search)]="search"
  [categoryOptions]="categoryOptions"
  [(selectedCategories)]="selectedCategories"
  [statusOptions]="statusOptions"
  [(statusFilter)]="statusFilter"
  (clear)="clearFilters()"
  (create)="openCreateProduct()"
/>

<app-product-table
  [rows]="filteredRows"
  [paginator]="true"
  [pageSize]="10"
  [pageSizeOptions]="[10, 20, 50]"
  [rowHover]="true"
  [minWidth]="'60rem'"
  (rowSelected)="openDetails($event)"
/>

<app-product-details
  [(visible)]="detailVisible"
  [selectedRow]="selectedRow"
  [stockSummary]="stockSummary"
  [batchesByProduct]="batchesByProduct"
  [outgoSummary]="outgoSummary"
  [inboundSummary]="inboundSummary"
  (audit)="openAuditDrawer()"
  (edit)="openEditProduct($event)"
  (closed)="closeDetails()"
/>

<app-product-logs
  [(visible)]="auditVisible"
  [(from)]="auditFrom"
  [(to)]="auditTo"
  [(actor)]="auditActor"
  [(actions)]="auditActions"
  [actionOptions]="auditActionOptions"
  [rows]="filteredAuditRows"
  [labelForAction]="auditLabel"
  [severityForAction]="auditSeverity"
  (exportCsv)="exportAuditCsv()"
  (clear)="resetAuditFilters()"
></app-product-logs>

<app-product-crud
  [(visible)]="productFormVisible"
  [isEditing]="isEditing"
  [unitOptions]="unitOptions"
  [categoryOptions]="categoryOptions"
  [styleClass]="'!w-full lg:!w-[50rem]'"
  [(form)]="formProduct"
  [(lotRows)]="lotRows"
  (cancel)="cancelProductForm()"
  (save)="saveProduct($event)"
></app-product-crud>
